env:
  NIXPKGS_ACCEPT_ANDROID_SDK_LICENSE: "1"
  NIXPKGS_ALLOW_UNFREE: "1"

inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs

nixpkgs:
  androidSdk.acceptLicense: true
  allowUnfree: true
