<path d="M 610 102 H 640" fill="none" stroke="#3a3730" stroke-width="1.6" marker-end="url(#arrow-dark)" />
<path d="M 825 102 H 855" fill="none" stroke="#3a3730" stroke-width="1.6" marker-end="url(#arrow-dark)" />
<path d="M 610 318 H 640" fill="none" stroke="#3a3730" stroke-width="1.6" marker-end="url(#arrow-dark)" />
<path d="M 825 318 H 855" fill="none" stroke="#3a3730" stroke-width="1.6" marker-end="url(#arrow-dark)" />

</svg>
