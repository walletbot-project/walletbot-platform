<path d="M 800 492 V 528 H 890 V 492" fill="none" stroke="#3a3730" stroke-width="1.6" />
<text x="845" y="550" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5f5a50" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">subetiquetas</text>

