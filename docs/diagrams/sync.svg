<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="674" viewBox="0 0 1000 674" role="img" aria-labelledby="title desc">
<title id="title">Sincronización offline-first</title><desc id="desc">La app guarda en su base local, trae los cambios del servidor, envía los suyos y se entera de cambios remotos por una suscripción.</desc>
<defs>
<style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }</style>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3a3730" /></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8a8478" /></marker>
<marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#24467a" /></marker>
<marker id="arrow-backend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2b5b34" /></marker>
<marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6d3fb0" /></marker>
<marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b5651d" /></marker>
</defs>
<rect width="1000" height="674" fill="#ffffff" />
<path d="M 186.66666666666666 100 V 614" stroke="#d6d1c6" stroke-width="1.5" stroke-dasharray="4 5" fill="none" />
<path d="M 500 100 V 614" stroke="#d6d1c6" stroke-width="1.5" stroke-dasharray="4 5" fill="none" />
<path d="M 813.3333333333333 100 V 614" stroke="#d6d1c6" stroke-width="1.5" stroke-dasharray="4 5" fill="none" />
<rect x="71.66666666666666" y="30" width="230" height="70" rx="12" fill="#f0f5fb" stroke="#a8bfdf" stroke-width="1.5" />
<text x="186.66666666666666" y="61" text-anchor="middle" font-size="18" font-weight="700" fill="#24467a">App móvil</text>
<text x="186.66666666666666" y="83" text-anchor="middle" font-size="14" font-weight="400" fill="#5f5a50">base local SQLite</text>
<rect x="385" y="30" width="230" height="70" rx="12" fill="#f1f7f0" stroke="#a6c8a2" stroke-width="1.5" />
<text x="500" y="61" text-anchor="middle" font-size="18" font-weight="700" fill="#2b5b34">Backend</text>
<text x="500" y="83" text-anchor="middle" font-size="14" font-weight="400" fill="#5f5a50">Convex</text>
<rect x="698.3333333333333" y="30" width="230" height="70" rx="12" fill="#f7f6f3" stroke="#cdc7ba" stroke-width="1.5" />
<text x="813.3333333333333" y="61" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1a16">Otro cliente</text>
<text x="813.3333333333333" y="83" text-anchor="middle" font-size="14" font-weight="400" fill="#5f5a50">otro celular o la web</text>
<path d="M 186.66666666666666 140 H 220.66666666666666 V 162 H 190.66666666666666" fill="none" stroke="#3a3730" stroke-width="1.8" marker-end="url(#arrow-dark)" />
<text x="230.66666666666666" y="136" text-anchor="start" font-size="14.5" font-weight="600" fill="#1c1a16" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Guarda el cambio en la base local</text>
<text x="230.66666666666666" y="154" text-anchor="start" font-size="13" font-weight="400" fill="#5f5a50" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">y lo marca como pendiente</text>
<circle cx="166.66666666666666" cy="151" r="12" fill="#3a3730" />
<text x="166.66666666666666" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
<text x="343.3333333333333" y="192" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1c1a16" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Pull: pide lo nuevo</text>
<path d="M 190.66666666666666 209 H 496" fill="none" stroke="#2b5b34" stroke-width="1.8" marker-end="url(#arrow-backend)" />
<text x="343.3333333333333" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#5f5a50" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">desde el último número de cambio que recibió</text>
<circle cx="166.66666666666666" cy="209" r="12" fill="#2b5b34" />
<text x="166.66666666666666" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
<text x="343.3333333333333" y="262" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1c1a16" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Cambios y borrados</text>
<path d="M 496 279 H 190.66666666666666" fill="none" stroke="#8a8478" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-gray)" />
<text x="343.3333333333333" y="298" text-anchor="middle" font-size="13" font-weight="400" fill="#5f5a50" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">la app los mezcla con last-writer-wins</text>
<text x="343.3333333333333" y="332" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1c1a16" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Push: envía lo pendiente</text>
<path d="M 190.66666666666666 349 H 496" fill="none" stroke="#2b5b34" stroke-width="1.8" marker-end="url(#arrow-backend)" />
<text x="343.3333333333333" y="368" text-anchor="middle" font-size="13" font-weight="400" fill="#5f5a50" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">junto con el número de cambio que conoce</text>
<circle cx="166.66666666666666" cy="349" r="12" fill="#2b5b34" />
<text x="166.66666666666666" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
<path d="M 500 408 H 534 V 430 H 504" fill="none" stroke="#2b5b34" stroke-width="1.8" marker-end="url(#arrow-backend)" />
<text x="544" y="404" text-anchor="start" font-size="14.5" font-weight="600" fill="#1c1a16" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">¿El número sigue igual?</text>
<text x="544" y="422" text-anchor="start" font-size="13" font-weight="400" fill="#5f5a50" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">sí: guarda y lo incrementa. No: rechaza y</text>
<text x="544" y="438" text-anchor="start" font-size="13" font-weight="400" fill="#5f5a50" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">la app vuelve al paso 2</text>
<circle cx="480" cy="419" r="12" fill="#2b5b34" />
<text x="480" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
<text x="656.6666666666666" y="476" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1c1a16" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Cambia algo</text>
<path d="M 809.3333333333333 493 H 504" fill="none" stroke="#3a3730" stroke-width="1.8" marker-end="url(#arrow-dark)" />
<text x="656.6666666666666" y="512" text-anchor="middle" font-size="13" font-weight="400" fill="#5f5a50" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">el número del usuario sube</text>
<circle cx="833.3333333333333" cy="493" r="12" fill="#3a3730" />
<text x="833.3333333333333" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
<text x="343.3333333333333" y="546" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1c1a16" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Aviso por suscripción</text>
<path d="M 496 563 H 190.66666666666666" fill="none" stroke="#8a8478" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-gray)" />
<text x="343.3333333333333" y="582" text-anchor="middle" font-size="13" font-weight="400" fill="#5f5a50" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">la app repite los pasos 2 y 3</text>
<path d="M 30 644 H 74" fill="none" stroke="#3a3730" stroke-width="1.8" marker-end="url(#arrow-dark)" />
<text x="86" y="649" text-anchor="start" font-size="14" font-weight="400" fill="#5f5a50">Pedido</text>
<path d="M 165.48 644 H 209.48" fill="none" stroke="#8a8478" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-gray)" />
<text x="221.48" y="649" text-anchor="start" font-size="14" font-weight="400" fill="#5f5a50">Respuesta o aviso</text>
</svg>
