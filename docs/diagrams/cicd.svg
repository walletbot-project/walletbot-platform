<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
<title id="title">Integración y despliegue continuos</title><desc id="desc">Qué corre en cada Pull Request, al integrar a main y cuando cambia la versión de la app.</desc>
<defs>
