<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Versionado y compatibilidad</title><desc id="desc">Al abrir, la app migra su base local y consulta la versión mínima; si está soportada sincroniza, si no pide actualizar y sigue funcionando sin conexión.</desc>
<defs>
<style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }</style>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3a3730" /></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8a8478" /></marker>
<marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#24467a" /></marker>
<marker id="arrow-backend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2b5b34" /></marker>
<marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6d3fb0" /></marker>
<marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b5651d" /></marker>
</defs>
<rect width="1000" height="470" fill="#ffffff" />
<rect x="630" y="20" width="350" height="380" rx="16" fill="#f1f7f0" stroke="#a6c8a2" stroke-width="1.5" />
<text x="648" y="50" text-anchor="start" font-size="20" font-weight="700" fill="#2b5b34">Contrato con el servidor</text>
<rect x="40" y="20" width="540" height="84" rx="12" fill="#f0f5fb" stroke="#a8bfdf" stroke-width="1.5" />
<text x="310" y="59" text-anchor="middle" font-size="16" font-weight="700" fill="#24467a">1. Abre la base local</text>
<text x="310" y="79" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5f5a50">si el esquema es viejo, aplica las migraciones pendientes sin perder datos</text>
<rect x="40" y="144" width="540" height="84" rx="12" fill="#f1f7f0" stroke="#a6c8a2" stroke-width="1.5" />
<text x="310" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#2b5b34">2. Consulta la versión mínima</text>
<text x="310" y="203" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5f5a50">GET /v1/config, sin necesidad de sesión</text>
<rect x="40" y="300" width="255" height="100" rx="12" fill="#ffffff" stroke="#c8dcc4" stroke-width="1.5" />
<text x="167.5" y="347" text-anchor="middle" font-size="16" font-weight="700" fill="#2b5b34">Sincroniza</text>
<text x="167.5" y="367" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5f5a50">con las funciones v1</text>
<rect x="325" y="300" width="255" height="100" rx="12" fill="#fffaf5" stroke="#efd3b8" stroke-width="1.5" />
<text x="452.5" y="347" text-anchor="middle" font-size="16" font-weight="700" fill="#8a4b14">Pide actualizar</text>
<text x="452.5" y="367" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5f5a50">y sigue funcionando sin conexión</text>
<rect x="650" y="70" width="310" height="140" rx="12" fill="#ffffff" stroke="#c8dcc4" stroke-width="1.5" />
<text x="805" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#2b5b34">Todo lleva versión</text>
<text x="805" y="157" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5f5a50">funciones como v1/sync y endpoints como</text>
<text x="805" y="174" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5f5a50">/v1/config</text>
<rect x="650" y="230" width="310" height="150" rx="12" fill="#ffffff" stroke="#c8dcc4" stroke-width="1.5" />
<text x="805" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#2b5b34">Cambio incompatible</text>
<text x="805" y="322" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5f5a50">se publica una v2 en paralelo y la v1 se</text>
<text x="805" y="339" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5f5a50">retira cuando ya ninguna app la usa</text>
<text x="310" y="440" text-anchor="middle" font-size="14" font-weight="400" fill="#5f5a50">El servidor repite el control al sincronizar, por si la app no pudo hacer el paso 2.</text>
<path d="M 310 104 V 144" fill="none" stroke="#3a3730" stroke-width="1.6" marker-end="url(#arrow-dark)" />
<path d="M 310 228 V 262 H 167 V 300" fill="none" stroke="#2b5b34" stroke-width="1.6" marker-end="url(#arrow-backend)" />
<text x="220" y="255" text-anchor="middle" font-size="13.5" font-weight="600" fill="#5f5a50" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">versión soportada</text>
<path d="M 310 228 V 262 H 452 V 300" fill="none" stroke="#b5651d" stroke-width="1.6" marker-end="url(#arrow-warn)" />
<text x="400" y="255" text-anchor="middle" font-size="13.5" font-weight="600" fill="#5f5a50" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">versión vieja</text>

</svg>
