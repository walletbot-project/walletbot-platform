name: Sticky PR comment
description: >
  Creates or updates a single PR comment identified by a hidden HTML marker,
  instead of posting a new comment on every run. Used so repeated pushes to a
  PR (redeploying a staging preview) and the eventual teardown update the same
  comment rather than spamming the PR timeline.

inputs:
  marker:
    description: Unique hidden marker identifying which sticky comment to update
    required: true
  body:
    description: Markdown body (the marker is appended automatically)
    required: true

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      with:
        script: |
          const marker = `<!-- sticky-comment: ${{ inputs.marker }} -->`
          const body = ${{ toJSON(inputs.body) }} + `\n\n${marker}`

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          })
          const existing = comments.find((c) => c.body?.includes(marker))

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            })
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
          }
