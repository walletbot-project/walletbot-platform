name: Resolve PR branch name
description: >
  Sanitizes github.head_ref to a safe token ([A-Za-z0-9._-] only) so it can be
  used as a Convex preview name / Cloudflare Pages branch without risking shell
  or command injection from an attacker-controlled branch name.

outputs:
  name:
    description: Sanitized branch name
    value: ${{ steps.branch.outputs.name }}

runs:
  using: composite
  steps:
    - id: branch
      shell: bash
      env:
        HEAD_REF: ${{ github.head_ref }}
      run: |
        set -euo pipefail
        safe="$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9._-' '-')"
        echo "name=$safe" >> "$GITHUB_OUTPUT"
