name: Deploy Web & Convex Preview

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Production build (push to main) targets the production Convex deployment.
      - name: Configure production environment
        if: github.event_name == 'push'
        run: |
          {
            echo "VITE_SITE_URL=https://app.walletbot.live"
            echo "VITE_CONVEX_URL=${{ vars.VITE_CONVEX_URL }}"
            echo "VITE_CONVEX_SITE_URL=${{ vars.VITE_CONVEX_SITE_URL }}"
          } >> "$GITHUB_ENV"

      # PRs get an isolated, ephemeral Convex preview deployment. This single step:
      #   1. Creates/updates the preview deployment (named after the branch) and
      #      captures its .convex.cloud URL via --cmd.
      #   2. Sets the per-branch SITE_URL on that deployment so better-auth's
      #      trustedOrigins / crossDomain accept the preview web origin.
      #   3. Stages the VITE_* values for the web build (.convex.site is derived
      #      from .convex.cloud).
      - name: Deploy Convex preview
        if: github.event_name == 'pull_request'
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          SITE="https://${{ github.head_ref }}.prev.walletbot.live"

          npx convex deploy \
            --preview-create "${{ github.head_ref }}" \
            --cmd-url-env-var-name CONVEX_URL_OUT \
            --cmd 'printf "%s" "$CONVEX_URL_OUT" > "$RUNNER_TEMP/convex_url"'

          URL="$(cat "$RUNNER_TEMP/convex_url")"
          NAME="$(printf '%s' "$URL" | sed -E 's#https?://([^.]+)\..*#\1#')"
          npx convex env set SITE_URL "$SITE" --deployment "$NAME"

          {
            echo "VITE_SITE_URL=$SITE"
            echo "VITE_CONVEX_URL=$URL"
            echo "VITE_CONVEX_SITE_URL=${URL/.convex.cloud/.convex.site}"
          } >> "$GITHUB_ENV"

      - name: Build web app
        working-directory: apps/web
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=walletbot-platform --branch=${{ github.head_ref || 'main' }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployed to: ${process.env.DEPLOYMENT_URL}`
            })
        env:
          # The branch preview lives at the custom domain (the same value as
          # VITE_SITE_URL), not the per-commit *.pages.dev deploy URL that
          # `steps.deploy.outputs.deployment-url` returns.
          DEPLOYMENT_URL: https://${{ github.head_ref }}.prev.walletbot.live
