name: Staging Previews

# Every job below is gated behind a PR label so staging environments are
# opt-in and don't burn Convex/Cloudflare preview quota on every PR:
#   - create-staging-web      -> backend preview + web Pages preview
#   - create-staging-landing  -> landing Pages preview
#   - create-staging-mobile   -> staging APK connected to the PR's backend
#                                preview (also brings up create-staging-web's
#                                backend + web preview, since the APK needs a
#                                backend to talk to)
# Removing a label tears down what it created. Since create-staging-mobile
# implies the web job, the backend + web preview are only torn down once
# BOTH create-staging-web and create-staging-mobile are absent.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

concurrency:
  group: staging-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.labels.*.name, 'create-staging-web') ||
      contains(github.event.pull_request.labels.*.name, 'create-staging-mobile')
    permissions:
      contents: read
      pull-requests: write
    outputs:
      branch_name: ${{ steps.branch.outputs.name }}
      convex_url: ${{ steps.backend.outputs.convex_url }}
      convex_site_url: ${{ steps.backend.outputs.convex_site_url }}
      web_url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/resolve-pr-branch
        id: branch

      # PRs get an isolated, ephemeral backend preview deployment. Creates/updates
      # the preview (named after the branch), captures its .convex.cloud URL, and
      # stages the VITE_* values for the web build (.convex.site is derived from
      # .convex.cloud). SITE_URL is set LATER, after the web deploy reveals the
      # real preview web origin.
      - name: Deploy backend preview
        id: backend
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          npx convex deploy \
            --preview-create "$BRANCH_NAME" \
            --cmd-url-env-var-name CONVEX_URL_OUT \
            --cmd 'printf "%s" "$CONVEX_URL_OUT" > "$RUNNER_TEMP/convex_url"'

          URL="$(cat "$RUNNER_TEMP/convex_url")"
          SITE_URL="${URL/.convex.cloud/.convex.site}"
          NAME="$(printf '%s' "$URL" | sed -E 's#https?://([^.]+)\..*#\1#')"

          {
            echo "CONVEX_PREVIEW_NAME=$NAME"
            echo "VITE_CONVEX_URL=$URL"
            echo "VITE_CONVEX_SITE_URL=$SITE_URL"
          } >> "$GITHUB_ENV"

          {
            echo "convex_preview_name=$NAME"
            echo "convex_url=$URL"
            echo "convex_site_url=$SITE_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Build web app
        working-directory: apps/web
        run: pnpm run build

      - name: Deploy web preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=walletbot-platform --branch=${{ steps.branch.outputs.name }}

      # Point the preview backend's SITE_URL at the real branch-alias origin (now
      # known) so better-auth trustedOrigins / crossDomain accept the browser's
      # auth requests — otherwise the preview loads but CORS-fails. The alias is
      # stable per branch and is the URL the PR comment links to.
      - name: Set backend preview SITE_URL
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          npx convex env set SITE_URL "${{ steps.deploy.outputs.pages-deployment-alias-url }}" \
            --deployment "$CONVEX_PREVIEW_NAME"

      - uses: ./.github/actions/sticky-pr-comment
        with:
          marker: staging-web
          body: |
            🚀 **Web staging preview deployed**

            - **App**: ${{ steps.deploy.outputs.pages-deployment-alias-url }}

            _Use this stable branch-alias URL — per-commit `<hash>.pages.dev` URLs are not trusted by the backend and will CORS-fail. Remove the `create-staging-web` label to tear this down (it also comes down automatically if `create-staging-mobile` is removed and no longer present)._

  destroy-web:
    runs-on: ubuntu-latest
    if: |
      github.event.action == 'unlabeled' &&
      (github.event.label.name == 'create-staging-web' || github.event.label.name == 'create-staging-mobile') &&
      !contains(github.event.pull_request.labels.*.name, 'create-staging-web') &&
      !contains(github.event.pull_request.labels.*.name, 'create-staging-mobile')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/resolve-pr-branch
        id: branch

      # There is no CLI flag for this — Convex's Management API is the only
      # documented way to delete a preview deployment programmatically
      # (docs.convex.dev/management-api/delete-deployment). It requires a Team
      # Access Token (Convex dashboard -> team settings), not the preview
      # deploy key used above.
      - name: Delete Convex preview deployment
        env:
          CONVEX_TEAM_ACCESS_TOKEN: ${{ secrets.CONVEX_TEAM_ACCESS_TOKEN }}
          CONVEX_TEAM_SLUG: ${{ vars.CONVEX_TEAM_SLUG }}
          CONVEX_PROJECT_SLUG: ${{ vars.CONVEX_PROJECT_SLUG }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail

          project_id="$(curl -sf \
            -H "Authorization: Bearer $CONVEX_TEAM_ACCESS_TOKEN" \
            "https://api.convex.dev/v1/teams/$CONVEX_TEAM_SLUG/projects/$CONVEX_PROJECT_SLUG/deployment?defaultProd=true" \
            | jq -r '.projectId')"

          names="$(curl -sf \
            -H "Authorization: Bearer $CONVEX_TEAM_ACCESS_TOKEN" \
            "https://api.convex.dev/v1/projects/$project_id/list_deployments?deploymentType=preview" \
            | jq -r --arg branch "$BRANCH_NAME" '.[] | select(.previewIdentifier == $branch) | .name')"

          if [ -z "$names" ]; then
            echo "No Convex preview deployment found for branch $BRANCH_NAME"
          fi

          for name in $names; do
            echo "Deleting Convex preview deployment $name"
            curl -sf -X POST \
              -H "Authorization: Bearer $CONVEX_TEAM_ACCESS_TOKEN" \
              "https://api.convex.dev/v1/deployments/$name/delete"
          done

      - name: Delete Cloudflare Pages preview deployments (web)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          ids="$(npx --yes wrangler@4 pages deployment list --project-name=walletbot-platform --environment=preview --json \
            | jq -r --arg branch "$BRANCH_NAME" '.[] | select(.deployment_trigger.metadata.branch == $branch) | .id')"

          if [ -z "$ids" ]; then
            echo "No Cloudflare Pages preview deployments found for branch $BRANCH_NAME"
          fi

          for id in $ids; do
            echo "Deleting Cloudflare Pages deployment $id"
            npx --yes wrangler@4 pages deployment delete "$id" --project-name=walletbot-platform -f
          done

      - uses: ./.github/actions/sticky-pr-comment
        with:
          marker: staging-web
          body: |
            🗑️ **Web staging preview removed**

  landing:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'create-staging-landing')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/resolve-pr-branch
        id: branch

      # The landing has no backend preview to pair with — it is fully static
      # apart from the Accept-Language redirect on `/` — so it deploys
      # independently of the web/backend job above.
      - name: Build landing
        working-directory: apps/landing
        run: pnpm run build

      # `workingDirectory` matters: Wrangler discovers Pages Functions at
      # `./functions` relative to the directory it runs in, so deploying from the
      # repo root would silently ship the site without `functions/index.ts` — and
      # `/` would 404 instead of redirecting.
      - name: Deploy landing preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/landing
          command: pages deploy dist --project-name=walletbot-landing --branch=${{ steps.branch.outputs.name }}

      - uses: ./.github/actions/sticky-pr-comment
        with:
          marker: staging-landing
          body: |
            🚀 **Landing staging preview deployed**

            - **Landing**: ${{ steps.deploy.outputs.pages-deployment-alias-url }}

  destroy-landing:
    runs-on: ubuntu-latest
    if: github.event.action == 'unlabeled' && github.event.label.name == 'create-staging-landing'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/resolve-pr-branch
        id: branch

      - name: Delete Cloudflare Pages preview deployments (landing)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          ids="$(npx --yes wrangler@4 pages deployment list --project-name=walletbot-landing --environment=preview --json \
            | jq -r --arg branch "$BRANCH_NAME" '.[] | select(.deployment_trigger.metadata.branch == $branch) | .id')"

          if [ -z "$ids" ]; then
            echo "No Cloudflare Pages preview deployments found for branch $BRANCH_NAME"
          fi

          for id in $ids; do
            echo "Deleting Cloudflare Pages deployment $id"
            npx --yes wrangler@4 pages deployment delete "$id" --project-name=walletbot-landing -f
          done

      - uses: ./.github/actions/sticky-pr-comment
        with:
          marker: staging-landing
          body: |
            🗑️ **Landing staging preview removed**

  mobile:
    needs: web
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'create-staging-mobile')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      # .env is gitignored but declared as a Flutter asset — the build needs it
      # to exist, and non-empty: flutter_dotenv throws EmptyEnvFileError on a
      # zero-byte file, crashing the app before runApp() ever runs. The actual
      # backend URLs come from --dart-define below, which wins over these
      # placeholder .env values — see apps/native/lib/config.dart.
      - run: cp .env.example .env
        working-directory: apps/native

      - run: flutter pub get
        working-directory: apps/native

      # --debug, not --release: apps/native/lib/app_config/bootstrap.dart only
      # skips the L0 bootstrap fetch (which always wins in release builds and
      # would silently redirect this APK to production once it succeeds) when
      # `!kReleaseMode && AppConfig.hasConfiguredBackendUrls` — i.e. a debug
      # build with these --dart-define values honors them instead of
      # overriding them from https://app.walletbot.live/_native/bootstrap.json.
      - name: Build staging APK
        working-directory: apps/native
        env:
          CONVEX_URL: ${{ needs.web.outputs.convex_url }}
          CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --debug \
            --dart-define=CONVEX_URL="$CONVEX_URL" \
            --dart-define=CONVEX_SITE_URL="$CONVEX_SITE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: staging-apk-pr-${{ github.event.pull_request.number }}
          path: apps/native/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - uses: ./.github/actions/sticky-pr-comment
        with:
          marker: staging-mobile
          body: |
            🚀 **Mobile staging APK built**

            Connected to this PR's staging backend: ${{ needs.web.outputs.convex_url }}

            Download it from the [workflow run artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) (requires a GitHub login). Remove the `create-staging-mobile` label to remove this build.

  destroy-mobile:
    runs-on: ubuntu-latest
    if: github.event.action == 'unlabeled' && github.event.label.name == 'create-staging-mobile'
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete staging APK artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: staging-apk-pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ids="$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            | jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name) | .id')"

          if [ -z "$ids" ]; then
            echo "No artifact named $ARTIFACT_NAME found"
          fi

          for id in $ids; do
            echo "Deleting artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - uses: ./.github/actions/sticky-pr-comment
        with:
          marker: staging-mobile
          body: |
            🗑️ **Mobile staging APK removed**
