name: Deploy Production

on:
  push:
    branches:
      - main
  # Manual runs exist to debug `build-ios`, which otherwise only fires on a
  # version bump, and a bump also cuts an Android release. That is a lot of
  # collateral for retrying an Xcode error. A dispatch runs the iOS job
  # alone: `deploy` and, through it, `build-android` are held back.
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deploy backend
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

      - name: Configure production environment
        run: |
          {
            echo "VITE_SITE_URL=https://app.walletbot.live"
            echo "VITE_CONVEX_URL=${{ vars.VITE_CONVEX_URL }}"
            echo "VITE_CONVEX_SITE_URL=${{ vars.VITE_CONVEX_SITE_URL }}"
          } >> "$GITHUB_ENV"

      - name: Build web app
        working-directory: apps/web
        run: pnpm run build

      - name: Deploy web app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=walletbot-platform --branch=main

      # The landing is a separate Pages project on its own domain (www), and
      # takes no build-time environment: it is fully static apart from the
      # Accept-Language redirect on `/`.
      - name: Build landing
        working-directory: apps/landing
        run: pnpm run build

      # `workingDirectory` matters: Wrangler discovers Pages Functions at
      # `./functions` relative to the directory it runs in, so deploying from the
      # repo root would silently ship the site without `functions/index.ts` — and
      # `/` would 404 instead of redirecting.
      - name: Deploy landing
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/landing
          command: pages deploy dist --project-name=walletbot-landing --branch=main

  # Both store jobs gate on the same verdict, so it is computed once. A second
  # copy of this logic would eventually disagree with the first, and the two
  # platforms would cut releases from different commits.
  #
  # A push that leaves apps/native/pubspec.yaml's `version:` untouched cuts no
  # release. Android still uploads an APK as a workflow artifact; iOS does not
  # run at all. The base is `github.event.before` rather than HEAD^ so a push
  # carrying several commits is compared as a whole. A force-push or an
  # unreadable base fails closed (no release), because a wrong "bumped" verdict
  # publishes a release under a version users already have.
  version:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
      bumped: ${{ steps.version.outputs.bumped }}
    steps:
      # Full history: the version check reads pubspec.yaml at
      # `github.event.before`, which a shallow clone does not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect app version bump
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version:[[:space:]]*//p' apps/native/pubspec.yaml | head -n1 | tr -d '\r')
          if [ -z "$current" ]; then
            echo "::error::apps/native/pubspec.yaml has no version: line"
            exit 1
          fi

          previous=""
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            previous=$(git show "${BEFORE}:apps/native/pubspec.yaml" 2>/dev/null \
              | sed -n 's/^version:[[:space:]]*//p' | head -n1 | tr -d '\r') || true
          fi

          if [ -n "$previous" ] && [ "$current" != "$previous" ]; then
            bumped=true
            echo "Version $previous -> $current: publishing release v${current}"
          else
            bumped=false
            echo "Version unchanged at ${current:-?} (base: ${previous:-unavailable}): APK artifact only"
          fi

          {
            printf 'version=%s\n' "$current"
            printf 'bumped=%s\n' "$bumped"
          } >> "$GITHUB_OUTPUT"

  build-android:
    needs: [deploy, version]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write # required to publish/update the GitHub Release below
    steps:
      - uses: actions/checkout@v4

      # convex_flutter cross-compiles a Rust binary per target ABI, which is
      # heavy on disk. GitHub-hosted runners ship with a lot of preinstalled
      # toolchains (dotnet, ghc, extra Docker images) that this job never uses
      # — free that up before installing Flutter, so it can't touch anything
      # the build actually needs (e.g. $AGENT_TOOLSDIRECTORY, which is where
      # flutter-action's cache below puts the SDK).
      - name: Free up runner disk space
        run: |
          set -uo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker image prune -a -f || true
          df -h /

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      # .env is gitignored but declared as a Flutter asset — the build needs it
      # to exist, and non-empty: flutter_dotenv throws EmptyEnvFileError on a
      # zero-byte file, crashing the app before runApp() ever runs. The actual
      # backend URLs come from --dart-define below, which wins over these
      # placeholder .env values — see apps/native/lib/config.dart.
      - run: cp .env.example .env
        working-directory: apps/native

      - run: flutter pub get
        working-directory: apps/native

      # Both artifacts must be signed with the real release key. Gradle now
      # fails the build outright when key.properties is absent on CI rather
      # than falling back to the runner's throwaway debug key, which produced
      # APKs that could not be installed over any other build of the app.
      - name: Restore release keystore
        working-directory: apps/native/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.jks
          {
            printf 'storeFile=keystore/release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > key.properties

      - name: Build production APK
        working-directory: apps/native
        env:
          CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=CONVEX_URL="$CONVEX_URL" \
            --dart-define=CONVEX_SITE_URL="$CONVEX_SITE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      # Play only accepts an AAB for upload, while testers need an APK they can
      # sideload directly, so a release carries both. `appbundle` recompiles the
      # Dart AOT snapshot from scratch, which roughly doubles this job's build
      # time, so it is skipped entirely on pushes that publish no release.
      - name: Build production app bundle
        if: needs.version.outputs.bumped == 'true'
        working-directory: apps/native
        env:
          CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build appbundle --release \
            --dart-define=CONVEX_URL="$CONVEX_URL" \
            --dart-define=CONVEX_SITE_URL="$CONVEX_SITE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      # One release per version, tagged exactly as pubspec.yaml spells it
      # (`v0.3.0+5`), so shipped builds keep a history. Re-running this job for
      # the same version updates that release in place instead of failing on
      # the existing tag.
      - name: Publish production release
        if: needs.version.outputs.bumped == 'true'
        working-directory: apps/native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          notes="Automatically built from main @ ${GITHUB_SHA}. Connected to the production backend."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" "$aab" --clobber
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" "$apk" "$aab" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "$notes"
          fi

      # No version bump, so the build is still worth keeping as a signed APK
      # anyone can grab from the run page, without it looking like a release.
      - name: Upload APK artifact
        if: needs.version.outputs.bumped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ needs.version.outputs.version }}-${{ github.sha }}
          path: apps/native/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # Requires four secrets that do not exist yet. Until they do, this job fails
  # at the signing step. docs/appstore-readiness.md § What you have to do walks
  # through producing them.
  #
  #   IOS_DIST_CERT_P12_BASE64  Apple Distribution certificate and its private
  #                             key, exported from Keychain Access as .p12,
  #                             then `base64 -i cert.p12 | pbcopy`
  #   IOS_DIST_CERT_PASSWORD    the password set when exporting that .p12
  #   APPSTORE_KEY_ID           App Store Connect API key id. The key MUST have
  #                             the **Admin** role: cloud signing is the one
  #                             thing App Manager cannot do, and exportArchive
  #                             fails with "Cloud signing permission error /
  #                             No profiles for 'live.walletbot.app' were
  #                             found" — which reads like a missing profile,
  #                             not a missing permission.
  #   APPSTORE_ISSUER_ID        App Store Connect API issuer id
  #   APPSTORE_PRIVATE_KEY      the whole AuthKey_<id>.p8 file, including the
  #                             BEGIN/END lines
  #
  # No provisioning profile secret: xcodebuild fetches and renews the profile
  # itself from the same API key, against the certificate imported below. One
  # less credential to rotate, and no profile to re-upload when the App ID
  # gains a capability.
  #
  # macOS runners bill at ten times the rate of Linux ones on a private repo,
  # so unlike Android this job runs only when the version is bumped. There is
  # no artifact-only path: an unreleased iOS build has nowhere to go.
  build-ios:
    needs: [deploy, version]
    # `skipped` is the manual-dispatch case, where `deploy` never ran.
    # Spelling the accepted results out rather than using `always()` keeps a
    # *failed* backend deploy from shipping a client build against it.
    if: >-
      !cancelled()
      && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
      && (github.event_name == 'workflow_dispatch'
          || needs.version.outputs.bumped == 'true')
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v4

      # connectivity_plus 7.3.x calls `NWPath.isUltraConstrained`, which only
      # exists in the iOS 26 SDK, so the build needs Xcode 26 or newer. Images
      # ship several Xcodes and default to an older one, hence the explicit
      # select. The listing stays in the log because "which Xcode built this"
      # is the first question every signing or SDK failure raises.
      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      # Same reason as the Android job: .env is a declared Flutter asset, so
      # whatever sits at that path ships inside the IPA. The placeholder keeps
      # flutter_dotenv from throwing on a missing file while carrying nothing
      # worth leaking. Real values arrive through --dart-define below.
      - run: cp .env.example .env
        working-directory: apps/native

      - run: flutter pub get
        working-directory: apps/native

      # A throwaway keychain, unlocked for the life of the job. `codesign` can
      # only read the private key after set-key-partition-list; without it the
      # build stops on a UI prompt no one is there to answer.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password=$(uuidgen)
          printf '%s' "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" build.keychain > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          security find-identity -v -p codesigning build.keychain

      - name: Install App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      # Two steps rather than `flutter build ipa`, because the archive needs
      # -allowProvisioningUpdates and flutter does not pass xcodebuild flags
      # through. The dart-defines still reach the archive: `flutter build ios`
      # writes them into ios/Flutter/Generated.xcconfig, which the Xcode build
      # phase reads.
      #
      # The build number comes from the run counter, not from pubspec. Apple
      # refuses any CFBundleVersion it has already seen for this version
      # string, including from builds it rejected, and github.run_number is the
      # only number here that always moves forward.
      - name: Compile the Dart build
        working-directory: apps/native
        env:
          CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build ios --release --no-codesign \
            --build-number="${{ github.run_number }}" \
            --dart-define=CONVEX_URL="$CONVEX_URL" \
            --dart-define=CONVEX_SITE_URL="$CONVEX_SITE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      # The one check that cannot be left to review: confirm the .env that
      # actually shipped is the committed placeholder and not somebody's local
      # file. A developer building this by hand skips the copy step above and
      # ships their dev deployment URL to Apple.
      - name: Verify no real credentials shipped in the bundle
        working-directory: apps/native
        run: |
          set -euo pipefail
          bundled=$(find build -path '*/App.framework/flutter_assets/.env' -print -quit)
          if [ -z "$bundled" ]; then
            echo "::error::no bundled .env found; the asset declaration moved"
            exit 1
          fi
          if ! cmp -s "$bundled" .env.example; then
            echo "::error::the bundled .env differs from .env.example"
            diff -u .env.example "$bundled" || true
            exit 1
          fi

      - name: Archive and export
        working-directory: apps/native/ios
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          auth=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
            -authenticationKeyID "$APPSTORE_KEY_ID"
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          )

          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>HN527U7W3J</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            "${auth[@]}"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist ExportOptions.plist \
            "${auth[@]}"

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa=$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -print -quit)
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
