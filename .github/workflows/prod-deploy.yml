name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deploy backend
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

      - name: Configure production environment
        run: |
          {
            echo "VITE_SITE_URL=https://app.walletbot.live"
            echo "VITE_CONVEX_URL=${{ vars.VITE_CONVEX_URL }}"
            echo "VITE_CONVEX_SITE_URL=${{ vars.VITE_CONVEX_SITE_URL }}"
          } >> "$GITHUB_ENV"

      - name: Build web app
        working-directory: apps/web
        run: pnpm run build

      - name: Deploy web app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=walletbot-platform --branch=main

      # The landing is a separate Pages project on its own domain (www), and
      # takes no build-time environment: it is fully static apart from the
      # Accept-Language redirect on `/`.
      - name: Build landing
        working-directory: apps/landing
        run: pnpm run build

      # `workingDirectory` matters: Wrangler discovers Pages Functions at
      # `./functions` relative to the directory it runs in, so deploying from the
      # repo root would silently ship the site without `functions/index.ts` — and
      # `/` would 404 instead of redirecting.
      - name: Deploy landing
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/landing
          command: pages deploy dist --project-name=walletbot-landing --branch=main

  build-apk:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to publish/update the GitHub Release below
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      # convex_flutter cross-compiles a Rust binary per target ABI, which is
      # heavy on disk. GitHub-hosted runners ship with a lot of preinstalled
      # toolchains (~/.dotnet, ghc, CodeQL, extra Android SDK images) that this
      # job never uses — free that up before the build instead of running the
      # risk of "No space left on device" mid-build.
      - name: Free up runner disk space
        run: |
          set -uo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker image prune -a -f || true
          df -h /

      # .env is gitignored but declared as a Flutter asset — the build needs it
      # to exist, and non-empty: flutter_dotenv throws EmptyEnvFileError on a
      # zero-byte file, crashing the app before runApp() ever runs. The actual
      # backend URLs come from --dart-define below, which wins over these
      # placeholder .env values — see apps/native/lib/config.dart.
      - run: cp .env.example .env
        working-directory: apps/native

      - run: flutter pub get
        working-directory: apps/native

      - name: Build production APK
        working-directory: apps/native
        env:
          CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=CONVEX_URL="$CONVEX_URL" \
            --dart-define=CONVEX_SITE_URL="$CONVEX_SITE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      # A single rolling release/tag (`production-latest`) rather than one
      # release per push, so there's always exactly one obvious "current
      # production APK" download link.
      - name: Publish production APK release
        working-directory: apps/native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          notes="Automatically built from main @ ${GITHUB_SHA}. Connected to the production backend."
          if gh release view production-latest >/dev/null 2>&1; then
            gh release upload production-latest "$apk" --clobber
            gh release edit production-latest --notes "$notes"
          else
            gh release create production-latest "$apk" \
              --title "Production APK (latest)" \
              --notes "$notes"
          fi
