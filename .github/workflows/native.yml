name: Native

on:
  pull_request:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      # .env is gitignored but declared as a Flutter asset — tests need it to
      # exist. It must be non-empty: flutter_dotenv throws EmptyEnvFileError on
      # a zero-byte file, so an empty `touch .env` crashes anything that calls
      # loadAppConfig() at runtime.
      - run: cp .env.example .env
        working-directory: apps/native

      - run: flutter pub get
        working-directory: apps/native

      - run: flutter analyze
        working-directory: apps/native

      - run: flutter test
        working-directory: apps/native
