name: app
description: "Wallet Bot is a personal expense tracker designed to remove the friction from managing your finances. Its core feature is a live voice mode — just talk, and your expenses are logged. No spreadsheets, no tedious forms. Just a conversation."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'   # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.4.0+11

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.3
  path: ^1.9.1
  google_sign_in: ^7.2.0
  # Held below 8.2.0 on purpose: that release requires Dart ^3.12.0 / Flutter
  # >=3.44.0, and CI pins Flutter 3.41.6 (.github/workflows/native.yml). A
  # caret range resolves to 8.2.0 on this machine (Dart 3.12.2) and then fails
  # to resolve on the runner. Lift the bound together with the CI pin.
  sign_in_with_apple: '>=8.1.0 <8.2.0'
  # Direct because `signInWithApple` hashes its nonce with it; it was already
  # here transitively.
  crypto: ^3.0.6
  http: ^1.6.0
  flutter_dotenv: ^5.2.1
  record: ^6.2.0
  permission_handler: ^12.0.1
  web_socket_channel: ^3.0.3
  uuid: ^4.5.3
  fl_chart: ^1.2.0
  intl: ^0.20.2
  m3e_buttons: ^0.0.3
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.11
  math_expressions: ^3.2.0
  # Feedback attachments. Held at 11.x deliberately: 12.x pulls
  # `windows_file_picker` -> `win32 ^6`, which cannot co-exist with
  # `package_info_plus ^8` (win32 <6). package_info_plus feeds `ClientInfo`, and
  # therefore the client-version gate, so bumping it two majors is not something
  # to do as a side effect of adding a file picker.
  file_picker: ^11.0.3
  connectivity_plus: ^7.3.1
  clock: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.1
  build_runner: ^2.13.1
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

# Launcher icons, rendered from `apps/landing/public/logo.svg`, the single
# source of truth shared with the web app and the landing site. Regenerate the
# platform assets with `dart run flutter_launcher_icons` after touching either
# PNG under `assets/icon/`.
#
# Both platforms show the notebook card on a white ground.
#
# `icon.png` is the flattened artwork: a white 1024px square with the card
# centred at 72% of the canvas height (669x737, so 177px of white to the sides
# and 143px above and below). iOS forbids alpha in app icons, and the squircle
# mask keeps well clear of the card at that scale. Android reuses it for the
# legacy mipmaps, which API 24-25 launchers show unmasked.
#
# API 26+ composes the adaptive layers instead: white background plus the card
# in the *foreground*, sized to 51% of the 108dp canvas, the largest scale
# whose opaque pixels all stay inside the 66dp safe circle, so no launcher mask
# can clip it. Against the 72dp visible area that lands the card at ~72% of the
# height, matching `icon.png`.
#
# `assets/icon/icon-android.png` is not a launcher asset. It is the transparent
# full-bleed card the login header draws (`lib/screens/login.dart`), and it has
# to stay alpha-backed so the mark sits on the auth backdrop rather than in a
# white box.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  # `minSdk` in android/app/build.gradle.kts resolves through
  # `flutter.minSdkVersion`, which the generator can't read, so state it here.
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  # The foreground PNG is already sized against the safe zone; skip the
  # generator's default 16% inset so the card isn't shrunk twice.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - .env
    - assets/agent-glyph.svg
    - assets/apple.svg
    - assets/google.svg
    - assets/icon/icon-android.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
