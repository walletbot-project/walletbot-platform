<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gasti icons</title>
<style>
body { margin: 0; background: #fff; }
#icons { max-width: 800px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 48px; padding: 48px 16px; }
.icon { width: 112px; height: 112px; border-radius: 32px; display: grid; place-items: center; overflow: hidden; }
</style>
</head>
<body>
<div id="icons"></div>
<script>
const f = (n) => Math.round(n * 100) / 100
const stops = (list) => list
    .map(([o, c, a = 1]) => `<stop offset="${o}" stop-color="${c}"${a < 1 ? ` stop-opacity="${a}"` : ''}/>`)
    .join('')
const lin = (id, [x1, y1, x2, y2], list, user = false) =>
    `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${user ? ' gradientUnits="userSpaceOnUse"' : ''}>${stops(list)}</linearGradient>`
const rad = (id, [cx, cy, r], list) =>
    `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stops(list)}</radialGradient>`
const bars = (list, cy, w, attrs = '') => list
    .map(([x, h]) => `<rect x="${f(x - w / 2)}" y="${f(cy - h / 2)}" width="${w}" height="${h}" rx="${w / 2}"${attrs}/>`)
    .join('')

const AMBER = [[0, '#fff5d9'], [0.5, '#ffcb73'], [1, '#f0a01c']]
const TEAL = [[0, '#3fe0cd'], [0.5, '#00978a'], [1, '#005c54']]
const MIC_TEAL = [[0, '#007a70'], [0.3, '#5fdccd'], [0.42, '#b8faf1'], [0.62, '#2cc4b3'], [1, '#005c54']]
const MIC_WHITE = [[0, '#a9e9df'], [0.35, '#ffffff'], [0.7, '#e3f8f4'], [1, '#9fdcd2']]

const BADGE = {
    deep: 'radial-gradient(circle at 30% 22%, #17a597 0%, #05665d 48%, #023b36 100%)',
    light: 'linear-gradient(150deg, #a4f5ea 0%, #6de7d8 52%, #4ccfbf 100%)',
    pearl: 'linear-gradient(160deg, #ffffff 0%, #f1fcf9 50%, #d6f4ee 100%)',
    night: 'radial-gradient(circle at 50% 30%, #11524b 0%, #082f2b 55%, #031917 100%)',
    amber: 'linear-gradient(150deg, #ffe6b0 0%, #ffcb73 50%, #f2a93a 100%)',
    teal: 'linear-gradient(150deg, #2ccab8 0%, #00897d 48%, #00534c 100%)',
}
const PEARL_BORDER = 'rgba(0,106,97,.14)'
const FLAT = {
    deep: '#00675e',
    brand: '#6de7d8',
    white: '#ffffff',
    night: '#12201e',
    amber: '#ffcb73',
    teal: '#00897d',
}

const BUBBLE = 'M18 7H30A12 12 0 0 1 42 19V22A12 12 0 0 1 30 34H18A12 12 0 0 1 6 22V19A12 12 0 0 1 18 7Z'
const TAIL = 'M10.5 28.5L8.6 40.4C8.4 41.8 9.9 42.6 11 41.7L21.5 33Z'
const DOTS = [16.5, 24, 31.5]

const MIC_STAND = 'M10 22A14 14 0 0 0 38 22M24 36V42M17 42H31'

const WAVE_BARS = [[15, 5], [19.5, 10], [24, 14], [28.5, 10], [33, 5]]
const RECEIPT = 'M13 6H35A2 2 0 0 1 37 8V41L32.67 38L28.33 41L24 38L19.67 41L15.33 38L11 41V8A2 2 0 0 1 13 6Z'

const SHOULDERS = 'M7 48V44A10 10 0 0 1 17 34H31A10 10 0 0 1 41 44V48Z'
const cuteEyes = (y, xs, rx, ry, color) => xs
    .map((x) =>
        `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${color}"/>` +
        `<circle cx="${f(x + rx * 0.35)}" cy="${f(y - ry * 0.35)}" r="${f(rx * 0.38)}" fill="#fff"/>` +
        `<circle cx="${f(x - rx * 0.3)}" cy="${f(y + ry * 0.4)}" r="${f(rx * 0.18)}" fill="#fff"/>`)
    .join('')
const blush = (y, xs, rx = 1.8, ry = 1) => xs
    .map((x) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#ff8a8a" fill-opacity=".6"/>`)
    .join('')
const NB_EYES = {
    open: cuteEyes(22, [20.8, 28.8], 2.2, 2.8, '#03302c'),
    happy: '<path d="M18.8 22.5Q20.8 19.8 22.8 22.5M26.8 22.5Q28.8 19.8 30.8 22.5" stroke="#03302c" stroke-width="1.7" stroke-linecap="round"/>',
}
const NB_MOUTH = {
    smile: '<path d="M22.8 26.6Q24.8 28.3 26.8 26.6" stroke="#03302c" stroke-width="1.5" stroke-linecap="round"/>',
    open: '<path d="M22.8 26.2H26.8A2 2 0 0 1 22.8 26.2Z" fill="#03302c"/>',
}
const NB_LABEL = {
    strip: (ink) => `<rect x="17.5" y="11" width="14" height="4" rx="2" fill="${ink}" fill-opacity=".9"/>`,
    mic: (ink) =>
        `<rect x="23.2" y="8.8" width="3.2" height="5.4" rx="1.6" fill="${ink}"/>` +
        `<path d="M21.8 12.2A3 3 0 0 0 27.8 12.2M24.8 15.2V16.4" stroke="${ink}" stroke-width="1.1" stroke-linecap="round"/>`,
    bars: (ink) => `<g fill="${ink}">${bars([[20.8, 1.6], [22.8, 3], [24.8, 4.4], [26.8, 3], [28.8, 1.6]], 13, 1.3)}</g>`,
    bubble: (ink, dot) =>
        `<rect x="20.3" y="9.3" width="9" height="6" rx="3" fill="${ink}"/>` +
        `<path d="M21.8 14.6L21.2 17L24.2 15Z" fill="${ink}"/>` +
        [22.6, 24.8, 27].map((x) => `<circle cx="${x}" cy="12.3" r=".75" fill="${dot}"/>`).join(''),
}

    `<defs>${lin(`${u}c`, [12, 7, 37, 41], cover, true)}</defs>` +
    `<g transform="translate(${dx} ${dy})">` +

    `<rect x="14" y="8" width="25" height="33" rx="5" fill="${pages}"/>` +
    `<rect x="12" y="7" width="25" height="33" rx="5" fill="url(#${u}c)"/>` +
    [11, 16, 21, 26, 31, 36].map((y) => `<rect x="9.5" y="${y}" width="5" height="2.2" rx="1.1" fill="#00453f"/>`).join('') +
    NB_LABEL[label](ink, dot) +
    NB_EYES[eyes] +
    blush(27, [17.6, 32]) +
    NB_MOUTH[mouth] +
    '</g>'

    {

            `<defs>${lin(`${u}b`, [6, 7, 40, 42], [[0, '#ffffff'], [1, '#cdf3ec']], true)}` +
            `${lin(`${u}w`, [0, 13, 0, 28], [[0, '#13b3a2'], [1, '#00675e']], true)}</defs>` +
